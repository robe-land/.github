name: Publication verification

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: publication-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m json.tool .github/lifecycle.json
      - run: git diff --check origin/main...HEAD
